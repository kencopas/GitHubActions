services:
  backend:
    image: ghcr.io/<OWNER>/myapp-backend:latest
    restart: always
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    image: ghcr.io/<OWNER>/myapp-frontend:latest
    restart: always

  proxy:
    image: nginx:alpine
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
